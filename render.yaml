# Render Blueprint — creates the API web service and its Postgres database.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: tmp-graphing-studio-api
    runtime: node
    plan: starter            # the free plan sleeps when idle; use starter or above for classroom use
    region: frankfurt        # pick the region closest to your users
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://graphing.themodernpedagogues.com
      - key: SESSION_SECRET
        generateValue: true
      - key: TMP_AUTH_MODE
        value: jwt-hs256      # or jwt-rs256 / introspect — see docs/AUTH_INTEGRATION.md
      - key: TMP_HANDOFF_SECRET
        sync: false           # paste the secret shared with the TMP site (set in the dashboard, never in git)
      - key: TMP_TOKEN_ISSUER
        value: themodernpedagogues.com
      - key: TMP_TOKEN_AUDIENCE
        value: tmp-graphing-studio
      - key: DATABASE_URL
        fromDatabase:
          name: tmp-graphing-studio-db
          property: connectionString

databases:
  - name: tmp-graphing-studio-db
    plan: basic-256mb
    region: frankfurt
